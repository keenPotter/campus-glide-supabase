project_id = "campusglide"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enable_signup = false
site_url = "http://localhost:5173"
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 10

[functions.auth]
verify_jwt = false

[functions.users]
verify_jwt = false

[functions.vehicle-requests]
verify_jwt = false

[functions.allocations]
verify_jwt = false

[functions.reschedule]
verify_jwt = false

[functions.print]
verify_jwt = false
static_files = ["./functions/print/nvsu-logo.png"]